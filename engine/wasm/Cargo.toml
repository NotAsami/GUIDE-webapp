[package]
name = "engine_wasm"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
engine_core = { path = "../core", features = ["ts"] }
wasm-bindgen = "=0.2.130"
serde-wasm-bindgen = "0.6"
serde = { version = "1", features = ["derive"] }
js-sys = "0.3"
console_error_panic_hook = "0.1"
