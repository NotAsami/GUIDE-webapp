name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # No Rust here: this only re-hashes engine/ against the committed build.
      - run: npm run engine:check
      - run: npm test
      # The same suite again with both engines answering; any difference fails.
      - run: npm run test:parity
      - run: npm run build
