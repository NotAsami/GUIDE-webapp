<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>G.U.I.D.E. — ROLL CONTEXT // PANEL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer">
<style>
:root{--bg:#1d1d1d;--bg-2:#161616;--beige:#d4bf7d;--beige-dim:#8a7a4a;--cyan:#00a6d6;--cyan-dim:#0d6e8c;--cyan-hot:#4dd6ff;--gold-rare:#e2b021;--text:#dedede;--muted:#aaaaaa;--danger:#b93a3a;--danger-hot:#ff5454;--teal:#3fc7b4;--violet:#7a6a8c;--violet-hot:#a594ba;--rail-w:436px;--bar-top-h:62px;--font-display:"Cinzel",serif;--font-prose:"EB Garamond",serif;--font-mono:"JetBrains Mono",ui-monospace,monospace}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;width:100%;background:var(--bg);color:var(--text);font-family:var(--font-prose);overflow:hidden;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:var(--cyan);text-decoration:none}a:hover{color:var(--cyan-hot)}
.stage{position:fixed;inset:0;background:url("https://www.transparenttextures.com/patterns/dark-leather.png"),radial-gradient(120% 90% at 50% 50%,#232220 0%,#1a1a1a 60%,#0e0e0e 100%);background-blend-mode:overlay,normal}
.scanlines{pointer-events:none;position:fixed;inset:0;z-index:90;background-image:repeating-linear-gradient(to bottom,rgba(255,255,255,0.025) 0 1px,transparent 1px,transparent 3px);mix-blend-mode:overlay}
.vignette{pointer-events:none;position:fixed;inset:0;z-index:91;background:radial-gradient(120% 110% at 50% 50%,transparent 55%,rgba(0,0,0,0.55) 95%,rgba(0,0,0,0.85) 100%)}

/* ---------- host screen behind the panel (context only) ---------- */
.topbar{position:fixed;top:0;left:0;right:0;height:var(--bar-top-h);z-index:20;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 36px;background:linear-gradient(to bottom,rgba(15,15,15,0.95),rgba(22,22,22,0.92));border-bottom:1px solid var(--beige);box-shadow:0 1px 0 rgba(212,191,125,0.15),0 8px 24px -8px rgba(0,0,0,0.6)}
.topbar::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:var(--beige);box-shadow:0 0 8px rgba(212,191,125,0.4)}
.tb-l,.tb-r{display:flex;align-items:center;gap:22px}.tb-r{justify-content:flex-end}
.tb-stat{display:flex;flex-direction:column;gap:5px;min-width:104px}
.tb-stat .row{display:flex;align-items:baseline;gap:8px}
.tb-stat .num{font-family:var(--font-display);font-weight:600;color:var(--beige);font-size:20px;line-height:1}
.tb-stat .lbl{font-family:var(--font-mono);font-size:9px;color:var(--cyan);letter-spacing:0.22em;text-transform:uppercase}
.tb-bar{height:3px;width:104px;border:1px solid var(--beige);background:rgba(0,0,0,0.5);position:relative;overflow:hidden}
.tb-bar>i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--cyan-dim),var(--cyan));box-shadow:0 0 6px rgba(0,166,214,0.6)}
.tb-c{text-align:center}
.tb-c .nm{font-family:var(--font-display);font-weight:600;font-size:17px;letter-spacing:0.16em;text-transform:uppercase;color:var(--text)}
.tb-c .sub{font-family:var(--font-mono);font-size:8.5px;letter-spacing:0.3em;color:var(--beige-dim);text-transform:uppercase;margin-top:4px}

.host{position:fixed;top:var(--bar-top-h);left:0;right:var(--rail-w);bottom:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;padding:40px}
.host-note{font-family:var(--font-mono);font-size:9px;letter-spacing:0.26em;text-transform:uppercase;color:var(--beige-dim);text-align:center;line-height:2}
.host-note b{color:var(--cyan);font-weight:400}
.acts{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:640px}
.act{--cut:11px;position:relative;background:none;border:0;padding:0;cursor:pointer;width:150px;height:74px;transition:transform 160ms ease}
.act:hover{transform:translateY(-2px)}
.act .a-frame{position:absolute;inset:0;background:var(--beige-dim);clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut));transition:background 180ms ease}
.act:hover .a-frame{background:var(--cyan)}
.act .a-inner{position:absolute;inset:1.5px;background:linear-gradient(180deg,#1a1a1a,#101010);clip-path:polygon(calc(var(--cut) - 1px) 0,100% 0,100% calc(100% - var(--cut) + 1px),calc(100% - var(--cut) + 1px) 100%,0 100%,0 calc(var(--cut) - 1px));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px}
.act .a-icon{font-size:17px;color:var(--beige);transition:color 180ms ease}
.act:hover .a-icon{color:var(--cyan-hot)}
.act .a-lbl{font-family:var(--font-mono);font-size:8.5px;letter-spacing:0.2em;text-transform:uppercase;color:var(--text)}
.act .a-sub{font-family:var(--font-mono);font-size:7.5px;letter-spacing:0.16em;text-transform:uppercase;color:var(--beige-dim)}

/* ============================================================
   ROLL CONTEXT RAIL
   ============================================================ */
.rail{position:fixed;top:var(--bar-top-h);right:0;bottom:0;width:var(--rail-w);z-index:40;display:flex;flex-direction:column;background:linear-gradient(180deg,rgba(14,14,14,0.97),rgba(10,10,10,0.98));border-left:1px solid var(--beige);box-shadow:-14px 0 40px -18px rgba(0,0,0,0.9),inset 1px 0 0 rgba(212,191,125,0.14)}
.rail::before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(0,166,214,0.028) 0 1px,transparent 1px 4px);mix-blend-mode:screen}

.rail-head{position:relative;z-index:2;flex:0 0 auto;padding:16px 18px 12px;border-bottom:1px solid rgba(212,191,125,0.3)}
.rh-top{display:flex;align-items:center;gap:10px}
.rh-num{font-family:var(--font-mono);font-size:9px;letter-spacing:0.26em;color:var(--cyan)}
.rh-title{font-family:var(--font-display);font-weight:600;font-size:14.5px;letter-spacing:0.2em;text-transform:uppercase;color:var(--beige)}
.rh-live{margin-left:auto;display:flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:8px;letter-spacing:0.2em;text-transform:uppercase;color:var(--beige-dim)}
.rh-live i{width:5px;height:5px;background:var(--cyan);border-radius:50%;box-shadow:0 0 7px var(--cyan);animation:blink 2.4s steps(1,end) infinite}
@keyframes blink{50%{opacity:0.25}}
.rh-sub{margin-top:8px;display:flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:8px;letter-spacing:0.16em;text-transform:uppercase;color:var(--beige-dim)}
.rh-sub .sep{flex:1;height:1px;background:linear-gradient(90deg,rgba(212,191,125,0.3),transparent)}
.rh-sub button{background:none;border:0;padding:0;cursor:pointer;font:inherit;letter-spacing:0.16em;color:var(--beige-dim);text-transform:uppercase}
.rh-sub button:hover{color:var(--cyan-hot)}

.rail-body{position:relative;z-index:2;flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;padding:14px 16px 26px;display:flex;flex-direction:column;gap:12px;scrollbar-width:thin;scrollbar-color:var(--beige-dim) transparent}
.rail-body::-webkit-scrollbar{width:7px}
.rail-body::-webkit-scrollbar-track{background:rgba(0,0,0,0.4)}
.rail-body::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--cyan-dim),rgba(212,191,125,0.5));border:1px solid #111}

/* ---------- entry shell ---------- */
.entry{--cut:12px;--edge:rgba(212,191,125,0.42);position:relative;flex:0 0 auto}
.entry .e-frame{position:absolute;inset:0;background:var(--edge);clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut));transition:background 220ms ease}
.entry .e-inner{position:relative;margin:1.5px;background:linear-gradient(180deg,#181818,#101010);clip-path:polygon(calc(var(--cut) - 1px) 0,100% 0,100% calc(100% - var(--cut) + 1px),calc(100% - var(--cut) + 1px) 100%,0 100%,0 calc(var(--cut) - 1px))}
.entry.latest{--edge:var(--cyan)}
.entry.latest .e-frame{box-shadow:0 0 16px rgba(0,166,214,0.35)}
.entry.crit{--edge:var(--gold-rare)}
.entry.crit .e-frame{box-shadow:0 0 16px rgba(226,176,33,0.35)}
.entry.fumble{--edge:var(--danger)}
.entry.fresh{animation:entryIn 420ms cubic-bezier(.2,.7,.2,1)}
@keyframes entryIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
.entry.stale{opacity:0.62}
.entry.stale:hover{opacity:1}

.e-head{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:11px;padding:11px 13px;cursor:pointer;user-select:none}
.e-head:hover .e-name{color:var(--cyan-hot)}
.e-glyph{width:30px;height:30px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(212,191,125,0.35);background:rgba(0,0,0,0.4);color:var(--beige);font-size:13px}
.entry.crit .e-glyph{border-color:rgba(226,176,33,0.6);color:var(--gold-rare)}
.e-name{font-family:var(--font-display);font-weight:600;font-size:14px;letter-spacing:0.09em;color:var(--text);transition:color 160ms ease;cursor:pointer;display:inline-flex;align-items:center;gap:7px;border-bottom:1px dotted rgba(212,191,125,0.45)}
.e-name:hover{color:var(--cyan-hot);border-bottom-color:var(--cyan)}
.e-name .bk{font-size:9px;color:var(--beige-dim);transition:color 160ms ease}
.e-name:hover .bk{color:var(--cyan-hot)}
.e-flavor{font-family:var(--font-prose);font-style:italic;font-size:13.5px;line-height:1.3;color:var(--muted);margin-top:2px;text-wrap:pretty}
.e-right{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.e-stamp{font-family:var(--font-mono);font-size:7.5px;letter-spacing:0.16em;color:var(--beige-dim)}
.e-fold{font-size:9px;color:var(--beige-dim);transition:transform 200ms ease}
.entry.folded .e-fold{transform:rotate(-90deg)}
.entry.folded .e-body{display:none}
.entry.folded .e-flavor{display:none}
.e-tag{position:absolute;top:-7px;right:14px;z-index:3;font-family:var(--font-mono);font-size:7.5px;letter-spacing:0.24em;text-transform:uppercase;padding:2px 8px;background:#0d0d0d;border:1px solid var(--gold-rare);color:var(--gold-rare);box-shadow:0 0 12px rgba(226,176,33,0.35)}
.entry.fumble .e-tag{border-color:var(--danger);color:var(--danger-hot);box-shadow:0 0 12px rgba(185,58,58,0.35)}

.e-body{padding:0 13px 12px}

/* ---------- a math line (attack / damage) ---------- */
.line{border-top:1px solid rgba(212,191,125,0.14);padding:9px 0 8px}
.line:first-child{border-top:0;padding-top:2px}
.l-head{display:flex;align-items:baseline;gap:9px}
.l-tag{font-family:var(--font-mono);font-size:8.5px;letter-spacing:0.24em;text-transform:uppercase;color:var(--cyan)}
.l-tag.dmg{color:var(--beige)}
.l-type{font-family:var(--font-mono);font-size:7.5px;letter-spacing:0.18em;text-transform:uppercase;color:var(--beige-dim);border:1px solid rgba(212,191,125,0.28);padding:1px 6px}
.l-type[data-t="radiant"]{color:var(--gold-rare);border-color:rgba(226,176,33,0.45)}
.l-type[data-t="fire"]{color:var(--danger-hot);border-color:rgba(255,84,84,0.45)}
.l-type[data-t="psychic"]{color:var(--violet-hot);border-color:rgba(165,148,186,0.5)}
.l-type[data-t="cold"]{color:var(--teal);border-color:rgba(63,199,180,0.45)}
.l-sum{margin-left:auto;font-family:var(--font-display);font-weight:600;font-size:19px;line-height:1;color:var(--text);letter-spacing:0.02em}
.line.crit-line .l-sum{color:var(--gold-rare);text-shadow:0 0 10px rgba(226,176,33,0.45)}
.l-math{margin-top:7px;display:flex;flex-wrap:wrap;align-items:center;gap:5px;font-family:var(--font-mono);font-size:10.5px;letter-spacing:0.06em;color:var(--muted)}
.l-math .op{color:var(--beige-dim)}
.l-math .form{color:var(--beige);letter-spacing:0.1em}
.l-math .eq{color:var(--cyan)}
.l-math .res{color:var(--text)}

/* die chip — hover for raw, click to reroll */
.die{position:relative;font:inherit;font-family:var(--font-mono);font-size:11px;font-weight:500;letter-spacing:0.04em;color:var(--text);background:rgba(0,166,214,0.07);border:1px solid rgba(0,166,214,0.42);padding:1px 7px;cursor:pointer;transition:all 150ms ease}
.die:hover{background:rgba(0,166,214,0.2);border-color:var(--cyan-hot);color:var(--cyan-hot);box-shadow:0 0 10px rgba(0,166,214,0.3)}
.die.max{border-color:var(--gold-rare);color:var(--gold-rare);background:rgba(226,176,33,0.1)}
.die.min{border-color:rgba(185,58,58,0.6);color:var(--danger-hot);background:rgba(185,58,58,0.09)}
.die.dropped{opacity:0.42;text-decoration:line-through;border-style:dashed;border-color:var(--beige-dim);color:var(--muted);background:transparent;cursor:default}
.die.dropped:hover{box-shadow:none;color:var(--muted)}
.die.critdie{border-color:rgba(226,176,33,0.55);background:rgba(226,176,33,0.07)}
.die.rerolled::after{content:"↻";position:absolute;top:-6px;right:-5px;font-size:8px;color:var(--cyan-hot);text-shadow:0 0 6px rgba(0,166,214,0.8)}
.die.spin{animation:dieSpin 340ms ease-out}
@keyframes dieSpin{0%{transform:translateY(-3px) scale(1.14);filter:brightness(2.2)}100%{transform:none;filter:none}}
.mod{font-family:var(--font-mono);font-size:11px;color:var(--text);border-bottom:1px dotted rgba(212,191,125,0.5);cursor:help}
.mod:hover{color:var(--beige)}

/* ---------- contributors / riders ---------- */
.riders{margin-top:4px;display:flex;flex-direction:column;gap:6px}
.rider{position:relative;border-left:2px solid rgba(212,191,125,0.32);background:rgba(255,255,255,0.016);padding:8px 10px 9px 11px}
.rider.on{border-left-color:var(--cyan)}
.rider.rolled{border-left-color:var(--gold-rare);background:rgba(226,176,33,0.045)}
.rider.off{opacity:0.4}
.rd-head{display:flex;align-items:center;gap:9px;cursor:pointer;user-select:none}
.rd-name{font-family:var(--font-mono);font-size:9.5px;letter-spacing:0.16em;text-transform:uppercase;color:var(--beige)}
.rider.rolled .rd-name{color:var(--gold-rare)}
.rider.off .rd-name{text-decoration:line-through}
.rd-src{font-family:var(--font-mono);font-size:7.5px;letter-spacing:0.14em;text-transform:uppercase;color:var(--beige-dim)}
.rd-val{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--cyan-hot);letter-spacing:0.06em}
.rider.rolled .rd-val{color:var(--gold-rare)}
.rd-sw{flex:0 0 auto;width:26px;height:13px;border:1px solid rgba(212,191,125,0.4);background:rgba(0,0,0,0.5);position:relative;cursor:pointer;transition:border-color 160ms ease}
.rd-sw::after{content:"";position:absolute;top:1px;left:1px;width:9px;height:9px;background:var(--beige-dim);transition:transform 170ms cubic-bezier(.3,.7,.2,1),background 170ms ease}
.rider.on .rd-sw,.rider.rolled .rd-sw{border-color:var(--cyan)}
.rider.on .rd-sw::after,.rider.rolled .rd-sw::after{transform:translateX(12px);background:var(--cyan-hot);box-shadow:0 0 7px rgba(0,166,214,0.7)}
.rd-fold{font-size:8px;color:var(--beige-dim);transition:transform 200ms ease}
.rider.folded .rd-fold{transform:rotate(-90deg)}
.rider.folded .rd-body{display:none}
.rd-body{margin-top:7px}
.rd-text{font-family:var(--font-prose);font-size:14px;line-height:1.4;color:var(--muted);text-wrap:pretty}
.rd-text em{color:var(--beige);font-style:italic}
.rd-run{margin-top:8px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.rd-form{font-family:var(--font-mono);font-size:10.5px;letter-spacing:0.1em;color:var(--beige);border:1px dashed rgba(212,191,125,0.4);padding:3px 8px}
.rd-btn{--cut:7px;position:relative;background:none;border:0;padding:0;cursor:pointer;height:24px;min-width:96px}
.rd-btn .b-frame{position:absolute;inset:0;background:var(--cyan);clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut))}
.rd-btn .b-in{position:absolute;inset:1px;background:#0d1417;clip-path:polygon(calc(var(--cut) - 1px) 0,100% 0,100% calc(100% - var(--cut) + 1px),calc(100% - var(--cut) + 1px) 100%,0 100%,0 calc(var(--cut) - 1px));display:flex;align-items:center;justify-content:center;gap:6px;font-family:var(--font-mono);font-size:8px;letter-spacing:0.22em;text-transform:uppercase;color:var(--cyan-hot);transition:background 160ms ease,color 160ms ease}
.rd-btn:hover .b-in{background:rgba(0,166,214,0.22);color:#fff}
.rd-cond{margin-top:7px;display:flex;align-items:center;gap:7px;font-family:var(--font-mono);font-size:8px;letter-spacing:0.16em;text-transform:uppercase;color:var(--beige-dim)}
.rd-cond i{color:var(--cyan)}
.rd-result{margin-top:8px;display:flex;flex-wrap:wrap;align-items:center;gap:5px;font-family:var(--font-mono);font-size:10.5px;color:var(--muted)}

/* ---------- entry footer totals ---------- */
.e-foot{margin-top:10px;border-top:1px solid rgba(212,191,125,0.28);padding-top:9px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tot{display:flex;flex-direction:column;gap:3px}
.tot .k{font-family:var(--font-mono);font-size:7.5px;letter-spacing:0.24em;text-transform:uppercase;color:var(--beige-dim)}
.tot .v{font-family:var(--font-display);font-weight:700;font-size:27px;line-height:1;letter-spacing:0.02em;color:var(--beige)}
.tot.atk .v{color:var(--cyan-hot);text-shadow:0 0 14px rgba(0,166,214,0.35)}
.entry.crit .tot.atk .v{color:var(--gold-rare);text-shadow:0 0 14px rgba(226,176,33,0.45)}
.entry.fumble .tot.atk .v{color:var(--danger-hot)}
.tot .split{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.tot .split span{font-family:var(--font-mono);font-size:7.5px;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted)}
.tot .split span b{font-weight:500;color:var(--beige)}
.tot .split span[data-t="radiant"] b{color:var(--gold-rare)}
.tot .split span[data-t="fire"] b{color:var(--danger-hot)}
.tot .split span[data-t="psychic"] b{color:var(--violet-hot)}
.tot .split span[data-t="cold"] b{color:var(--teal)}
.pending-note{cursor:help;margin-top:8px;font-family:var(--font-mono);font-size:8px;letter-spacing:0.14em;text-transform:uppercase;color:var(--gold-rare);display:flex;align-items:center;gap:7px}

/* ---------- tooltip ---------- */
.tip{position:fixed;z-index:120;pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity 120ms ease,transform 120ms ease;background:#0b0b0b;border:1px solid var(--cyan);padding:7px 10px;max-width:250px;box-shadow:0 8px 26px -10px #000}
.tip.show{opacity:1;transform:none}
.tip .t-k{font-family:var(--font-mono);font-size:8px;letter-spacing:0.22em;text-transform:uppercase;color:var(--cyan);margin-bottom:4px}
.tip .t-v{font-family:var(--font-mono);font-size:10px;line-height:1.5;color:var(--text)}
.tip .t-hint{margin-top:5px;font-family:var(--font-mono);font-size:7.5px;letter-spacing:0.14em;text-transform:uppercase;color:var(--beige-dim)}
.rail-body:empty::before{content:"AWAITING ROLL";position:absolute;top:44%;left:0;right:0;text-align:center;font-family:var(--font-mono);font-size:9px;letter-spacing:0.34em;color:var(--beige-dim);opacity:0.55}

/* ---------- catalog sheet (slides over the rail) ---------- */
.cat{position:absolute;inset:0;z-index:6;display:none;flex-direction:column;background:linear-gradient(180deg,#121212,#0b0b0b);border-left:1px solid var(--cyan);box-shadow:-18px 0 46px -18px rgba(0,0,0,0.95),inset 1px 0 0 rgba(0,166,214,0.25)}
.cat.open{display:flex;animation:catIn 260ms cubic-bezier(.2,.75,.2,1)}
@keyframes catIn{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}
.cat::before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(0,166,214,0.03) 0 1px,transparent 1px 4px);mix-blend-mode:screen}
.cat-bar{position:relative;z-index:2;flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:13px 16px 11px;border-bottom:1px solid rgba(0,166,214,0.35)}
.cat-bar .k{font-family:var(--font-mono);font-size:8.5px;letter-spacing:0.26em;text-transform:uppercase;color:var(--cyan)}
.cat-bar .src{font-family:var(--font-mono);font-size:7.5px;letter-spacing:0.16em;text-transform:uppercase;color:var(--beige-dim)}
.cat-close{margin-left:auto;background:none;border:1px solid rgba(212,191,125,0.35);color:var(--beige-dim);width:24px;height:24px;cursor:pointer;font-size:10px;transition:all 150ms ease}
.cat-close:hover{border-color:var(--cyan);color:var(--cyan-hot);background:rgba(0,166,214,0.12)}
.cat-body{position:relative;z-index:2;flex:1 1 auto;min-height:0;overflow-y:auto;padding:18px 18px 26px;scrollbar-width:thin;scrollbar-color:var(--beige-dim) transparent}
.cat-body::-webkit-scrollbar{width:7px}.cat-body::-webkit-scrollbar-track{background:rgba(0,0,0,0.4)}
.cat-body::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--cyan-dim),rgba(212,191,125,0.5));border:1px solid #111}
.cat-name{font-family:var(--font-display);font-weight:600;font-size:25px;letter-spacing:0.03em;line-height:1.12;color:var(--text);text-shadow:0 0 16px rgba(0,166,214,0.12)}
.cat-line{margin-top:9px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-family:var(--font-mono);font-size:9.5px;letter-spacing:0.16em;text-transform:uppercase;color:var(--muted)}
.cat-line .school{color:var(--beige);display:inline-flex;align-items:center;gap:6px}
.cat-line .school i{color:var(--cyan);font-size:9px}
.cat-line .sep{color:var(--beige-dim)}
.cat-grid{margin-top:16px;display:grid;grid-template-columns:1fr 1fr;border-top:1px solid rgba(212,191,125,0.22);border-left:1px solid rgba(212,191,125,0.22)}
.cat-cell{padding:10px 12px;border-right:1px solid rgba(212,191,125,0.22);border-bottom:1px solid rgba(212,191,125,0.22);display:flex;flex-direction:column;gap:5px}
.cat-cell.span2{grid-column:1/-1}
.cat-cell .k{font-family:var(--font-mono);font-size:8px;letter-spacing:0.24em;text-transform:uppercase;color:var(--cyan)}
.cat-cell .v{font-family:var(--font-mono);font-size:12px;letter-spacing:0.05em;color:var(--text)}
.cat-dmg{display:flex;flex-wrap:wrap;gap:6px}
.cat-dmg span{font-family:var(--font-mono);font-size:10px;letter-spacing:0.1em;text-transform:uppercase;border:1px solid rgba(212,191,125,0.3);padding:2px 7px;color:var(--beige)}
.cat-dmg span[data-t="radiant"]{color:var(--gold-rare);border-color:rgba(226,176,33,0.45)}
.cat-dmg span[data-t="fire"]{color:var(--danger-hot);border-color:rgba(255,84,84,0.45)}
.cat-dmg span[data-t="slashing"]{color:var(--text)}
.cat-lbl{display:block;margin:18px 0 8px;font-family:var(--font-mono);font-size:8px;letter-spacing:0.28em;text-transform:uppercase;color:var(--cyan)}
.cat-desc{font-family:var(--font-prose);font-size:15.5px;line-height:1.68;color:var(--text);text-wrap:pretty}
.cat-desc p{margin:0 0 11px}.cat-desc p:last-child{margin:0}
.cat-desc em{color:var(--beige);font-style:italic}
.cat-rider{border-left:2px solid rgba(212,191,125,0.35);background:rgba(255,255,255,0.016);padding:9px 11px;margin-bottom:8px}
.cat-rider .rn{font-family:var(--font-mono);font-size:9.5px;letter-spacing:0.16em;text-transform:uppercase;color:var(--beige);display:flex;align-items:center;gap:8px}
.cat-rider .rn span{margin-left:auto;font-size:7.5px;color:var(--beige-dim)}
.cat-rider .rt{margin-top:6px;font-family:var(--font-prose);font-size:14px;line-height:1.45;color:var(--muted)}
.cat-dm{margin-top:20px;border:1px solid rgba(226,176,33,0.35);background:rgba(226,176,33,0.045);padding:11px 12px}
.cat-dm .k{font-family:var(--font-mono);font-size:8px;letter-spacing:0.24em;text-transform:uppercase;color:var(--gold-rare);display:flex;align-items:center;gap:7px}
.cat-dm .v{margin-top:7px;font-family:var(--font-prose);font-size:14px;line-height:1.5;color:var(--muted);font-style:italic}
</style>
</head>
<body>
<div class="stage"></div>

<header class="topbar">
  <div class="tb-l">
    <div class="tb-stat"><div class="row"><span class="num">41</span><span class="lbl">HP</span></div><div class="tb-bar"><i style="width:84%"></i></div></div>
    <div class="tb-stat"><div class="row"><span class="num">17</span><span class="lbl">AC</span></div><div class="tb-bar"><i style="width:62%"></i></div></div>
  </div>
  <div class="tb-c"><div class="nm">Ros Chrisstone</div><div class="sub">Oathsworn · Level 7</div></div>
  <div class="tb-r"><div class="tb-stat"><div class="row"><span class="num">3</span><span class="lbl">Shards</span></div><div class="tb-bar"><i style="width:50%"></i></div></div></div>
</header>

<main class="host">
  <div class="host-note">Host screen — <b>any</b> screen<br>the rail overlays whatever is beneath it</div>
  <div class="acts">
    <button class="act" data-act="greatsword"><span class="a-frame"></span><span class="a-inner"><span class="a-icon"><i class="fa-solid fa-khanda"></i></span><span class="a-lbl">Greatsword</span><span class="a-sub">1d12 · slashing</span></span></button>
    <button class="act" data-act="flame"><span class="a-frame"></span><span class="a-inner"><span class="a-icon"><i class="fa-solid fa-fire-flame-curved"></i></span><span class="a-lbl">Sacred Flame</span><span class="a-sub">DEX save · DC 15</span></span></button>
    <button class="act" data-act="stealth"><span class="a-frame"></span><span class="a-inner"><span class="a-icon"><i class="fa-solid fa-user-ninja"></i></span><span class="a-lbl">Stealth</span><span class="a-sub">skill · dis.</span></span></button>
  </div>
</main>

<aside class="rail" aria-label="Roll context">
  <div class="rail-head">
    <div class="rh-top"><span class="rh-num">07</span><span class="rh-title">Roll Context</span><span class="rh-live"><i></i>Live</span></div>
    <div class="rh-sub"><span id="rc-count">0 rolls</span><span class="sep"></span><button id="rc-fold">Collapse all</button><button id="rc-clear">Clear</button></div>
  </div>
  <div class="rail-body" id="rail-body" aria-live="polite"></div>
  <div class="cat" id="cat" role="dialog" aria-label="Catalog entry">
    <div class="cat-bar"><span class="k">Catalog Entry</span><span class="src">DM Compendium · synced</span><button class="cat-close" id="cat-close" aria-label="Close"><i class="fa-solid fa-xmark"></i></button></div>
    <div class="cat-body" id="cat-body"></div>
  </div>
</aside>

<div class="scanlines"></div>
<div class="vignette"></div>
<div class="tip" id="tip"></div>

<script src="roll-context.js"></script>
</body>
</html>
